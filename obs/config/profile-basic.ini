[General]
Name=IRL

[Video]
BaseCX=1280
BaseCY=720
OutputCX=1280
OutputCY=720
FPSType=0
FPSCommon=30

[Output]
Mode=Simple

[SimpleOutput]
VBitrate=4500
ABitrate=160
StreamEncoder=x264
Preset=veryfast
UseAdvanced=false
# Twitch (and most RTMP ingest, generally) needs ~2s keyframe spacing to ever
# flip a stream to "live" - normally OBS's built-in Twitch *service* enforces
# this automatically via obs_service_apply_encoder_settings, but we use the
# generic rtmp_custom service (see dashboard/app.py: ensure_obs_restream_target)
# since OBS talks to our own restream relay, not Twitch directly. That means
# none of Twitch's service-specific defaults apply - x264's own default
# keyint (much longer) is what's left, and Twitch's ingest just never
# validates the stream: connection stays open, bytes flow, dashboard/OBS both
# show "streaming", but the channel never goes live. No error anywhere to
# point at it. Set explicitly here instead of relying on service enforcement.
KeyintSec=2

[Audio]
SampleRate=48000
ChannelSetup=Stereo
