srt {
    worker_threads 1;
    worker_connections 200;

    http_port 8080;
    cors_header *;

    database_path /var/lib/sls/streams.db;

    log_file /dev/stdout;
    log_level info;

    rate_limit_api 30;
    rate_limit_stats 300;
    rate_limit_config 20;

    server {
        listen_player 4000;
        listen_publisher 4001;
        listen_publisher_srtla 4002;   # srtla_rec forwards de-bonded SRT here

        latency_min 200;
        latency_max 5000;

        backlog 100;
        # Lowered from the 15s default: the watchdog needs a stale/dead
        # publisher slot to free up quickly so a reconnecting phone (or the
        # RTMP->SRT bridge after an RTMP reconnect) isn't stuck behind a
        # zombie session. See watchdog/watchdog.py for the actual failover
        # timing (DOWN_THRESHOLD_SEC), which reacts faster than this via the
        # /stats bitrate signal - this just bounds the worst case.
        idle_streams_timeout 5;

        publisher_exit_delay 5;
        record_hls off;
    }
}
