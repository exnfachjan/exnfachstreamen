load_module modules/ngx_rtmp_module.so;

# One worker: the RTMP->SRT bridge below pulls the stream back over
# localhost - with more than one worker the publisher can land on a
# different worker than the one serving the pull, and it hangs forever.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
rtmp_socket_dir /tmp;
events {}

rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        # ---- public ingest: phone/encoder -> here ----------------------
        # Stream key = the same PUBLISH_KEY used for SRT/SRTLA (one key,
        # all three protocols). $name is whatever the encoder sends as the
        # RTMP stream key.
        application live {
            live on;

            notify_method post;
            on_publish http://dashboard:8000/rtmp/auth/publish;

            # RTMP -> SLS bridge, so RTMP publishers show up in sls's stats
            # and can be read by OBS the same way as SRT/SRTLA publishers.
            # -c copy: no transcoding. Requires H.264 + AAC from the encoder.
            exec_push /usr/bin/ffmpeg -nostdin -loglevel warning
                -i rtmp://127.0.0.1:1935/live/$name
                -c copy -f mpegts "srt://127.0.0.1:4001?streamid=$name"
                2>>/tmp/ffmpeg-live-$name.log;

            record off;
            wait_key on;
            wait_video on;
        }

        # ---- internal egress: OBS -> here -> fan out -> every Twitch target
        # Not meant for encoders. Key = RESTREAM_KEY (a separate secret from
        # PUBLISH_KEY, set in .env - see .env.example).
        #
        # The fan-out itself is one `exec_push ffmpeg ...` line per Twitch
        # channel in the included file below, not nginx-rtmp's native `push`
        # directive - push has a known crash bug (segfaults the whole worker,
        # taking every connection on it down with it, if a target resolves to
        # an unreachable IPv6 address) that a plain ffmpeg subprocess dying
        # doesn't have. The list lives in restream.d/targets.conf, written by
        # the dashboard (see dashboard/app.py: write_restream_targets) and
        # picked up by reload-watcher.sh (nginx has no live-reload for
        # exec_push lines, so that watcher does `nginx -s reload` on change).
        application restream {
            live on;

            notify_method post;
            on_publish http://dashboard:8000/rtmp/auth/restream;

            include /etc/nginx/restream.d/targets.conf;

            record off;
        }
    }
}

http {
    access_log off;

    # Not 8080 - sls's own HTTP API/health already owns that port in this
    # container. This is RTMP-specific stats only.
    server {
        listen 6969;

        location /rtmpstats {
            rtmp_stat all;
        }
    }
}
