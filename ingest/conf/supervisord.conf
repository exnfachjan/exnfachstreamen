[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=error
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
childlogdir=/var/log/

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# --- sls: SRT ingest 4001, SRTLA ingest 4002, playback 4000, API/stats 8080
[program:sls]
priority=50
autostart=true
autorestart=unexpected
redirect_stderr=true
user=sls
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/usr/local/bin/sls -c /etc/sls/sls.conf

# --- srtla_rec: bonded SRTLA on 5000 -> hands off to sls:4002
[program:srtla]
priority=100
autostart=true
autorestart=unexpected
redirect_stderr=true
user=srtla
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/bin/sh -c "sleep 2 && /usr/local/bin/srtla_rec --srtla_port=5000 --srt_hostname=localhost --srt_port=4002 --log_level=${SRTLA_LOG_LEVEL:-info}"

# --- nginx: RTMP ingest 1935 (live + restream apps), RTMP stats 6969
# Starts after sls, because on_publish/exec_push assume sls is already
# listening on 4001. nginx resolves the on_publish target hostname
# ("dashboard") once at config-load time and refuses to start at all if it
# doesn't resolve yet - and on a cold `docker compose up`, the dashboard
# container (which depends on this one) can easily not exist yet. Waiting
# for the name to resolve first avoids nginx dying in a restart loop for
# up to a couple of minutes on every fresh stack start.
[program:nginx]
priority=200
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/bin/sh -c "until getent hosts dashboard >/dev/null 2>&1; do sleep 1; done; exec /usr/sbin/nginx -g 'daemon off;'"

# --- reload-watcher: re-reads restream.d/targets.conf when the dashboard
# changes the Twitch destination list and reloads nginx to pick it up.
# nginx-rtmp's `push` list has no live-reload of its own.
[program:reload-watcher]
priority=250
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
command=/usr/local/bin/reload-watcher.sh
